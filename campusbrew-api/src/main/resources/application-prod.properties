spring.application.name=campusbrew-api

# Most PaaS hosts (Render, Railway, Fly) inject the port to bind on.
server.port=${PORT:8080}

# MongoDB
spring.data.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.database=${MONGODB_DATABASE:campusbrew}

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Email (OTP sending)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Delivery assignment defaults (Module 3 Wave C)
delivery.dispatch.timeoutSeconds=${DELIVERY_DISPATCH_TIMEOUT_SECONDS:60}
delivery.orderExpiry.minutes=${DELIVERY_ORDER_EXPIRY_MINUTES:10}
