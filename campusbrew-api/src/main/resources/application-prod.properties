spring.application.name=campusbrew-api

# Most PaaS hosts (Render, Railway, Fly) inject the port to bind on.
server.port=${PORT:8080}

# MongoDB
spring.data.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.database=${MONGODB_DATABASE:campusbrew}

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Email (OTP sending)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Delivery assignment defaults (Module 3 Wave C)
delivery.orderExpiry.minutes=${DELIVERY_ORDER_EXPIRY_MINUTES:10}

# ================= v2.0 (SRS/SDD v2.0) =================
fees.deliveryFee=${FEES_DELIVERY_FEE:15}
fees.commission=${FEES_COMMISSION:5}
incentive.threshold=${INCENTIVE_THRESHOLD:5}
cod.limit=${COD_LIMIT:300}
delivery.offer.rebroadcastSeconds=${DELIVERY_OFFER_REBROADCAST_SECONDS:60}
tip.maxAmount=${TIP_MAX_AMOUNT:100}
tip.windowHours=${TIP_WINDOW_HOURS:24}
rating.windowHours=${RATING_WINDOW_HOURS:24}
rating.minCountToShow=${RATING_MIN_COUNT_TO_SHOW:3}
chat.readOnlyAfterMinutes=${CHAT_READONLY_AFTER_MINUTES:30}
inventory.lowStockDefault=${INVENTORY_LOW_STOCK_DEFAULT:5}
xendit.secretKey=${XENDIT_SECRET_KEY:}
xendit.callbackToken=${XENDIT_CALLBACK_TOKEN:}
xendit.successUrl=${XENDIT_SUCCESS_URL:campusbrew://payment/success}
xendit.failureUrl=${XENDIT_FAILURE_URL:campusbrew://payment/failure}
